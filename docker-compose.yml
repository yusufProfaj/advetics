services:
  postgres:
    image: postgres:16-alpine
    container_name: advetics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: advetics
    ports:
      - '5433:5432'
    volumes:
      - advetics-pgdata:/var/lib/postgresql/data
      # Sadece volume ilk kez oluşturulurken çalışır.
      # Yeniden çalıştırmak için: pnpm infra:reset
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d advetics']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: advetics-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - advetics-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  advetics-pgdata:
  advetics-redisdata:
